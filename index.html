<!doctype html>
<html>
  <head>
    <title>PasswordsGenerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="big-dev">
      <div class="text-el">
        <h1 class="txtup">Generate a</h1>
        <h1 class="txtmiddle">random password</h1>
        <span class="txtdown">Never use an insecure password again.</span>
      </div>
      <div class="generate-div">
        <button class="generate-btn" onclick="generate_btn()">
          Generate passwords
        </button>
      </div>

      <div class="random-txt">
        <div class="two-btn">
          <button class="first-btn" id="firstRandom-el"></button>
          <button class="second-btn" id="secondRandom-el"></button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
